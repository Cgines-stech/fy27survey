<!--index.html-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FY27 Survey</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>FY27 Survey</h1>
    <p class="intro">Please complete the form below.</p>

    <form id="reviewForm">
      <label>
        Program
        <select id="program" required>
          <option value="">Select a program</option>
        </select>
      </label>

      <label>
        Course
        <select id="course" required disabled>
          <option value="">Select a program first</option>
        </select>
      </label>

      <label>
        Instructor's Name
        <select id="instructorName" required disabled>
          <option value="">Select a course first</option>
        </select>
      </label>

      <label>
        Instructor Review
        <select id="instructorReview" required>
          <option value="">Select a rating</option>
          <option value="Poor">Poor</option>
          <option value="Good">Good</option>
          <option value="Excellent">Excellent</option>
          <option value="N/A">N/A</option>
        </select>
      </label>

      <label>
        Course Review
        <select id="courseReview" required>
          <option value="">Select a rating</option>
          <option value="Poor">Poor</option>
          <option value="Good">Good</option>
          <option value="Excellent">Excellent</option>
          <option value="N/A">N/A</option>
        </select>
      </label>

      <label>
        Are you completing the program and want to leave feedback about institutional services?
        <select id="leaveServiceFeedback" required>
            <option value="">Select an option</option>
            <option value="No">No</option>
            <option value="Yes">Yes</option>
        </select>
        </label>

        <section id="serviceFeedbackSection" style="display: none;">
        <h2>Institutional Services Feedback</h2>

        <label>
            Service
            <select id="service">
            <option value="">Select a service</option>
            </select>
        </label>

        <label>
            How was the service?
            <select id="serviceReview">
            <option value="">Select a rating</option>
            <option value="Poor">Poor</option>
            <option value="Good">Good</option>
            <option value="Excellent">Excellent</option>
            <option value="N/A">N/A</option>
            </select>
        </label>

        <label>
            Would you like to leave additional information?
            <textarea id="serviceAdditionalInfo" rows="5"></textarea>
        </label>
        </section>

      <button type="submit" id="submitButton">Submit Review</button>
    </form>

    <div id="confirmationMessage" style="display: none;">
        <h2>Your submission has been received.</h2>
        <p>Thank you for your feedback.</p>
    </div>

    <p id="statusMessage"></p>
  </main>

    <script src="data.js"></script>
    <script src="instructor.js"></script>
    <script src="services.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
