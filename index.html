<!--index.html-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FY27 Survey</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>FY27 Survey</h1>

    <form id="reviewForm">
      <section class="form-step active">
        <p class="intro">Thank you for taking this survey, please press Next to continue.</p>
      </section>

      <section class="form-step">
        <h2>Course Information</h2>

        <label>
          Program
          <select id="program" required>
            <option value="">Select a program</option>
          </select>
        </label>

        <label>
          Course
          <select id="course" required disabled>
            <option value="">Select a program first</option>
          </select>
        </label>
      </section>

      <section class="form-step">
        <h2>Course Feedback</h2>
        <div id="courseMatrix"></div>
      </section>

      <section class="form-step">
        <h2>Instructor Feedback</h2>
        <div id="instructorFeedbackContainer"></div>
        <button type="button" id="addInstructorButton">Add Another Instructor</button>
      </section>

      <section class="form-step">
        <h2>Program Completion</h2>

        <label>
          Is this your last course in the program?
          <select id="isLastCourse" required>
            <option value="">Select an option</option>
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select>
        </label>
      </section>

      <section class="form-step" id="programFeedbackStep">
        <h2>Program Feedback</h2>
        <div id="programMatrix"></div>

        <label>
          What did you like most about the program?
          <textarea id="programPositiveFeedback" rows="5"></textarea>
        </label>

        <label>
          What could be improved about the program?
          <textarea id="programImprovementFeedback" rows="5"></textarea>
        </label>
      </section>

      <section class="form-step" id="serviceChoiceStep">
        <h2>Service Feedback</h2>

        <label>
          Would you like to leave feedback for one of the following services?
          <select id="service">
            <option value="">Select an option</option>
          </select>
        </label>
      </section>

      <section class="form-step" id="serviceFeedbackStep">
        <h2 id="serviceFeedbackTitle">Service Feedback</h2>
        <div id="serviceMatrix"></div>

        <label>
          What went well with this service?
          <textarea id="servicePositiveFeedback" rows="5"></textarea>
        </label>

        <label>
          What could be improved with this service?
          <textarea id="serviceImprovementFeedback" rows="5"></textarea>
        </label>
      </section>

      <section class="form-step" id="additionalFeedbackStep">
        <h2>Additional Feedback</h2>

        <label>
          Is there anything else you would like to share?
          <textarea id="additionalFeedback" rows="6"></textarea>
        </label>
      </section>

      <div class="button-row">
        <button type="button" id="backButton" class="secondary-button">Back</button>
        <button type="button" id="nextButton">Next</button>
        <button type="submit" id="submitButton" style="display: none;">Submit Survey</button>
      </div>
    </form>

    <div id="confirmationMessage" style="display: none;">
      <h2>Your submission has been received.</h2>
      <p>Thank you for your feedback.</p>
    </div>

    <p id="statusMessage"></p>
  </main>

  <script src="data.js"></script>
  <script src="instructor.js"></script>
  <script src="services.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
